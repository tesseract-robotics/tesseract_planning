name: Deploy Documentation

on:
  push:
    branches:
      - master

  # allow manually starting this workflow
  workflow_dispatch:

# Supersede in-progress pull-request runs; queue everything else so two runs on one ref never race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy_documentation:
    runs-on: ubuntu-18.04
    steps:
      - uses: actions/checkout@v7

      - name: Build Doxygen Documentation
        uses: mattnotmitt/doxygen-action@v1
        with:
            doxyfile-path: 'docs/doxygen.config'

      - name: Deploy Documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          publish_dir: ./docs
          destination_dir: tesseract_planning
          keep_files: true
          external_repository: tesseract-robotics/tesseract_docs
